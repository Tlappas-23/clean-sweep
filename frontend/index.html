<!doctype html>
<!--
  Entry document for the Clean Sweep frontend (Vite injects the bundle).
  Loads the display serif (Playfair Display) and body sans (Inter) from
  Google Fonts; both fall back to system fonts if the request fails.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a08" />
    <meta
      name="description"
      content="Clean Sweep: draft a six-category Oscar ballot from a slot-machine year and run it through a 30-ceremony awards season."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Clean Sweep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
