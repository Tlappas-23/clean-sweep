<!doctype html>
<!--
  Entry document for the Clean Sweep frontend (Vite injects the bundle).
  Loads the display serif (Bodoni Moda, variable across its 6-96 optical
  size axis so small headings get the sturdy cut) and the body sans (Inter)
  from Google Fonts; both fall back to system faces if the request fails.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />
    <meta
      name="description"
      content="Clean Sweep: three film games from one catalogue. Draft an eight-slot awards ballot, recast a film from its shortlist, or name the actor who connects two others."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Clean Sweep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
