# Publishes the frontend to GitHub Pages as a playable demo.
#
# What is deployed and what is not
# --------------------------------
# Pages serves static files, so the FastAPI backend is deployed separately
# (see render.yaml) and this bundle talks to it over HTTPS. `VITE_API_BASE`
# below names it, which is why that server keeps a CORS allow-list rather than
# a wildcard: these are two different origins.
#
# The API URL is a repository *variable*, not a secret. It is public the moment
# a browser makes a request to it, so hiding it would only make it harder to
# change. Set it once under Settings > Secrets and variables > Actions >
# Variables, as CLEAN_SWEEP_API_URL.
#
# If that variable is unset the build falls back to VITE_API_MOCK=true, which
# swaps in the in-memory adapter from `src/api/mock.ts`: every rule and score
# is the real one, computed in the browser, but over a few dozen fixture films
# instead of 4,180. AppShell says so when that happens. The fallback exists so
# a fork with no backend still deploys something playable rather than a site
# that errors on every click.
#
# Two details GitHub Pages needs that a normal build does not:
#
#   * a base path, because a project site is served from a subdirectory rather
#     than the domain root (`PAGES_BASE`, read by vite.config.ts);
#   * a 404.html fallback, which is no longer load-bearing but is still worth
#     shipping. Routing is hash-based (frontend/src/App.tsx), so every real
#     URL resolves to /clean-sweep/ and returns 200; Pages has no rewrite
#     rules and would otherwise answer a deep link with a 404 status while
#     rendering it correctly, which is worse than failing outright because
#     anything reading the status rather than the body sees a broken page.
#
#     The fallback now exists only for links shared in the old path shape:
#     Pages serves 404.html for them, and public/redirect.js translates
#     /clean-sweep/grid?seed=X into /clean-sweep/#/grid?seed=X before the app
#     mounts, so an already-shared round is not lost.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys with a short-lived token rather than a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is allowed to finish rather than being
# cancelled, so a push never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The demo is the public face of the project, so it does not ship
      # without passing the same gates as everything else.
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx eslint .
      - name: Test
        run: npx vitest run

      # One line of output that says which of the two the deploy will be, so
      # "why is it showing sample data" is answerable from the run log rather
      # than by inspecting the bundle.
      - name: Report the API target
        run: |
          if [ -n "${{ vars.CLEAN_SWEEP_API_URL }}" ]; then
            echo "Building against the live API: ${{ vars.CLEAN_SWEEP_API_URL }}"
          else
            echo "::warning::CLEAN_SWEEP_API_URL is not set; building the fixture demo instead."
          fi

      - name: Build
        env:
          # Repository name, so the base path follows a rename automatically.
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Empty when the variable is unset, which is what makes the mock
          # fall back below.
          VITE_API_BASE: ${{ vars.CLEAN_SWEEP_API_URL }}
          VITE_API_MOCK: ${{ vars.CLEAN_SWEEP_API_URL == '' && 'true' || 'false' }}
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
