# ---------------------------------------------------------------------------
# Backend package manifest.
#
# Three importable top-level packages live in this directory:
#   app/        the FastAPI service (request path)
#   pipeline/   offline data build (IMDb + Oscars -> parquet -> packed seed)
#   ml/         offline model training (-> data/models, data/seed/ml_scores)
#
# Install in editable mode from the repo root:
#   python -m venv .venv && .venv/bin/pip install -e "backend[dev]"
# ---------------------------------------------------------------------------
[project]
name = "clean-sweep-backend"
version = "0.1.0"
description = "Oscar-ballot drafting game: data pipeline, ML models and REST API"
requires-python = ">=3.11"
authors = [{ name = "Thomas Lappas", email = "thomas.lappas1010@gmail.com" }]
# What the *deployed server* needs, and nothing else.
#
# The split below is the whole reason the production image is ~40 MB rather
# than ~530 MB. The offline halves of this project lean on pandas, pyarrow,
# numpy, scikit-learn and duckdb, which together are 230 MB of wheel and 96 MB
# of resident memory. The request path uses none of them: the seed is packed
# offline into gzipped columnar JSON (see pipeline/pack.py) and read back with
# the standard library, and the models' *outputs* are joined into that seed
# rather than being run at request time.
#
# So this list has to stay short. Anything added here is paid for on every
# deploy, on every cold start, and out of the 512 MB the free tier allows.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",  # Postgres driver; SQLite needs nothing extra
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The offline data build: IMDb TSVs -> parquet -> the packed seed.
pipeline = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "duckdb>=1.0",   # streams the 1.4 GB IMDb TSVs without loading them
  "httpx>=0.27",   # TMDB / OMDb enrichment
]
# Model training and evaluation. Never imported by the server.
ml = [
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
]
# Everything, for local development and CI.
dev = [
  "clean-sweep-backend[pipeline,ml]",
  "pytest>=8",
  "ruff>=0.5",
  "httpx>=0.27",
  "psutil>=5.9",   # the memory-budget test
]

[tool.setuptools]
packages = ["app", "pipeline", "ml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's whole dependency system is built on calling Query()/Depends() in
# argument defaults, which is exactly what flake8-bugbear's B008 forbids.
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
